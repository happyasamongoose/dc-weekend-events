# .github/workflows/refresh.yml
# Weekly events.json refresh — Thursdays 10:00 UTC + manual trigger.
# Cadence (weekly vs twice-monthly theater) is decided INSIDE sweep.mjs,
# so this is the ONLY refresh workflow.
#
# If sweep.mjs hits its safety fallback (too few events / too many track
# errors / a bad recurring.json) it exits non-zero: this run shows red, no
# commit happens, and the last good events.json stays published. A failure
# also files an issue — a silent red run went unnoticed for a week once.

name: Refresh events

on:
  schedule:
    # Thursdays 05:17 UTC. The old 10:00 slot fired 4–7 hours late every week —
    # GitHub delays busy cron minutes — so this is a quieter one.
    - cron: "17 5 * * 4"
  workflow_dispatch:
    inputs:
      tracks:
        description: "Only run these track numbers, e.g. '6' or '1,4'. Implies dry run."
        required: false
        default: ""
      dry_run:
        description: "Run everything but write and commit nothing"
        type: boolean
        default: false

concurrency:
  group: refresh-events # a manual run won't overlap the scheduled one
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 7 tracks, 3 at a time, up to 8 min each: worst case ~24 min.
    timeout-minutes: 30
    # Scoped on the job rather than the workflow, so the grant sits next to the
    # steps that use it. Actions are pinned to commit SHAs: a moving major tag
    # would run whatever it points at inside a job holding a writable token and
    # the API key.
    permissions:
      contents: write # to commit events.json
      issues: write # to report a failed run
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # Both suites are dependency-free and take under a second. A broken parser
      # should stop the run here, before it spends anything on the API.
      - name: Test
        run: |
          node scripts/test-sweep.mjs
          node scripts/test-page.mjs

      # sweep.mjs has zero npm dependencies — no install step needed.
      # The key is passed only as an env var; it is never echoed or logged.
      # Output is tee'd to a file so a failure can quote its last lines in the
      # issue it files. pipefail keeps the step red when node exits non-zero.
      - name: Run sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SWEEP_TRACKS: ${{ github.event.inputs.tracks }}
          SWEEP_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -o pipefail
          node scripts/sweep.mjs 2>&1 | tee sweep.log

      - name: Commit events.json if changed
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.tracks == ''
        run: |
          # --porcelain also catches the very first run, when events.json is new/untracked
          if [ -z "$(git status --porcelain -- events.json)" ]; then
            echo "events.json unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "refresh events.json ($(date -u +%Y-%m-%d))"
            git push
          fi

      # A green scheduled run closes the failure issue, so it tracks live state.
      - name: Close failure issue
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search "Weekly events refresh failed in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The scheduled refresh succeeded on $(date -u +%Y-%m-%d): $RUN_URL"
          fi

      # A red run is only useful if somebody hears about it. The issue is
      # assigned to the repo owner — an assignment sends an email; an unassigned
      # issue sat unseen for 29 days — and quotes the sweep's last lines so it
      # says why. One issue is reused so a broken month isn't a pile of them.
      # Manual dry runs don't file anything.
      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="Weekly events refresh failed"
          tail_log=$(tail -n 15 sweep.log 2>/dev/null || echo "(no sweep output captured)")
          body="The scheduled refresh failed on $(date -u +%Y-%m-%d). The last good events.json is still published, so the page is showing older listings — it flags itself as stale after 10 days.

          Last lines of the sweep:
          \`\`\`
          $tail_log
          \`\`\`

          Run log: $RUN_URL"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            gh issue edit "$existing" --add-assignee "$OWNER" >/dev/null 2>&1 || true
          else
            gh issue create --title "$title" --body "$body" --assignee "$OWNER"
          fi
