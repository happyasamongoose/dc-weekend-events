# .github/workflows/test.yml
# The suites had been red for weeks with nothing to notice it. They are
# dependency-free and finish in about a second, so they run on every push.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: sweep logic
        run: node scripts/test-sweep.mjs
      - name: page logic
        run: node scripts/test-page.mjs
